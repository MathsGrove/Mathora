name: Deploy MathsGrove website

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check app JavaScript and website integrity
        run: |
          node --check marketing.js
          node --check whiteboard.js
          node scripts/check-whiteboard-v2.mjs
          node scripts/check-paper-save-queue.mjs
          node --check sample.js
          node --check sample-extras.js
          node --check insights-upgrade.js
          node --check maths-render.js
          node --input-type=module --check < baseline.js
          node --input-type=module --check < baseline-calc.js
          node --input-type=module --check < baseline-admin.js
          node --input-type=module --check < assigned-practice.js
          node scripts/check-practice-utc-date.mjs
          node --input-type=module --check < evidence-workspace.js
          node scripts/check-evidence-marking.mjs
          node scripts/test-all-tier-evidence.mjs
          node --input-type=module --check < assigned-admin.js
          node --input-type=module --check < examiner-workspace.js
          node --input-type=module --check < student-release-feed.js
          node scripts/check-dashboard-upgrade.mjs
          node --input-type=module --check < tier-role-experience.js
          node scripts/check-tier-role-experience.mjs
          node --input-type=module --check < schedule-readiness.js
          node scripts/check-programme-schedule-readiness.mjs
          node --input-type=module --check < editorial-review.js
          node scripts/check-auto-assign.mjs
          node scripts/check-assigned-answer-reliability.mjs
          node scripts/check-approved-practice-gate.mjs
          node --input-type=module --check < access-router.js
          node --input-type=module --check < auth-password.js
          node --input-type=module --check < portal.js
          node --input-type=module --check < student-welcome.js
          node scripts/check-student-welcome.mjs
          node --input-type=module --check < studio.js
          node --input-type=module --check < signature-editorial.js
          node --input-type=module --check < access-management.js
          node --input-type=module --check < family-access.js
          node --input-type=module --check < family-timing.js
          node --check report-reader.js
          node scripts/check-family-timing-report.mjs
          node --input-type=module --check < reasoning-demo.js
          node scripts/check-reasoning-demo.mjs
          node --check showcase-v3.js
          node --check experience-v4.js
          node scripts/check-calendar-marketing.mjs
          node --check marketing-experience-v5.js
          node --check marketing-polish-v6.js
          node --check examiner-report-book.js
          node --check welcome-experience-v8.js
          node --check atelier-v9.js
          node --check maths-gallery-v13.js
          node --check maths-private-motion-v14.js
          node --check maths-preview-insights-v14.js
          node --input-type=module --check < content-bank.js
          node --input-type=module --check < supabase/functions/invitations/index.ts
          node scripts/check-studio-html-head.mjs
          node scripts/check-site.mjs
          node scripts/check-marketing-v5.mjs
          node scripts/check-experience-v6.mjs
          node scripts/check-examiner-book.mjs
          node scripts/check-welcome-v8.mjs
          node scripts/check-atelier-v9.mjs
          node scripts/check-maths-gallery-v13.mjs
          node scripts/check-maths-refinement-v14.mjs
          node scripts/check-insights.mjs
          node scripts/check-family-access.mjs
          node scripts/check-family-refresh-race.mjs
          node scripts/check-password-auth.mjs
          node scripts/test-password-auth.mjs
          node scripts/check-feedback-auth.mjs
          node scripts/check-student-export.mjs
          node scripts/check-edge-origins.mjs
          node --input-type=module --check < student-offboarding.js
          node --input-type=module --check < student-export-download.js
          node scripts/test-access-router.mjs
          node scripts/check-baseline.mjs
          node scripts/check-baseline-seeds.mjs
          node scripts/check-content.mjs
          node scripts/check-published-originals.mjs
          node scripts/check-tier-delivery.mjs
          node scripts/check-signature-editorial.mjs
          node scripts/check-verified-batch-20261101.mjs
          node scripts/check-verified-batch-20261101-0300.mjs
          node scripts/check-verified-batch-20261101-0500.mjs
          node scripts/check-original-practice.mjs
      - name: Assemble only MathsGrove public assets
        shell: bash
        run: |
          mkdir -p site
          cp maths-refinement-v14.css maths-private-motion-v14.js maths-preview-insights-v14.js site/
          cp index.html report.html report-pages.html reasoning-demo.html reasoning-demo.css reasoning-demo.js reasoning-model.mjs robots.txt sitemap.xml report-reader.css report-reader.js report-preview.css mathsgrove.css brand-refresh.css marketing-services.css marketing.js mathsgrove-icon.svg showcase-v3.css showcase-v3.js experience-v4.css experience-v4.js marketing-experience-v5.css marketing-experience-v5.js marketing-polish-v6.css marketing-polish-v6.js examiner-report-book.css examiner-report-book.js welcome-experience-v8.css welcome-experience-v8.js atelier-v9.css atelier-v9.js calendar-dialog-polish.css maths-cinematic-v11.css maths-gallery-v13.css maths-gallery-v13.js site/
          cp portal.html portal.css private-refresh.css student-features.css evidence-theme.css timed-mock.css maths-notation.css portal.js maths-render.js mathsgrove-config.js whiteboard.js student-release-feed.js student-release-feed.css site/
          cp auth-password.js auth-password.css site/
          cp student-welcome.js student-welcome.css site/
          cp studio-refine.css site/
          cp assigned-practice.js assigned-practice.css site/
          cp evidence-workspace.js evidence-workspace.css student-analysis.css examiner-evidence.css site/
          cp baseline.html baseline.css baseline.js baseline-calc.js site/
          cp studio.html studio.css studio.js examiner-workspace.js examiner-workspace.css schedule-readiness.js schedule-readiness.css admin-learner.css content-bank.js content-bank.css timed-mock.css maths-notation.css access-management.css access-management.js access-router.js baseline-admin.js site/
          cp assigned-admin.js assigned-admin.css site/
          cp signature-editorial.js signature-editorial.css site/
          cp student-offboarding.js student-offboarding.css site/
          cp export.html export.css student-export-download.js site/
          cp editorial-review.js site/
          cp family.html family-access.css family-access.js family-timing.css family-timing.js tier-role-experience.js tier-role-experience.css site/
          mkdir -p site/content
          cp content/boards.json content/paper-blueprints.json site/content/
          # Client runtime only; never publish editorial answer keys or review labs.
          mkdir -p site/content/marking
          cp content/marking/staging-rpc-client.mjs content/marking/original-authoring-ui.mjs content/marking/examiner-moderation-ui.mjs content/marking/examiner-workbench-ui.mjs content/marking/examiner-assist.mjs content/marking/constructed-practice-ui.mjs content/marking/student-assignment-feed.mjs content/marking/linked-original-reports.mjs content/marking/pilot-integration.css content/marking/examiner-workbench.css site/content/marking/
          mkdir -p site/content/programmes
          cp content/programmes/service-tiers.json content/programmes/draft-questions.json content/programmes/practice-gcse-v2.json content/programmes/practice-igcse-v2.json content/programmes/practice-foundation-core-v2.json site/content/programmes/
          cp content/programmes/extra-practice-120.json content/programmes/exam-reasoning-drafts-12.json site/content/programmes/
          cp content/programmes/original-question-bank-144.json site/content/programmes/
          mkdir -p site/content/GCSE site/content/IGCSE
          cp content/GCSE/draft-exemplars.json site/content/GCSE/
          cp content/IGCSE/draft-exemplars.json site/content/IGCSE/
          cp sample.html sample.css sample-extras.css sample.js sample-extras.js insights-upgrade.css insights-upgrade.js private-polish-v6.css site/
          cp journey.html journey.css journey.js embed-bridge.js unified-site.js site/
          touch site/.nojekyll
      - name: Verify private marking keys never enter Pages artifact
        run: node scripts/check-marking-v2-public-bundle.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          name: mathsgrove-curated-site
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: mathsgrove-curated-site