name: MathsGrove live dashboards delivery check
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/live-dashboards.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-website:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Confirm new dashboard markup and assets are live
        shell: bash
        run: |
          set -euo pipefail
          base='https://mathsgrove.github.io/Mathora'
          tmp="$(mktemp)"
          for target in studio.html portal.html examiner-workspace.js examiner-workspace.css student-release-feed.js student-release-feed.css; do
            status="$(curl --silent --show-error --location --retry 3 --retry-delay 2 --max-time 20 \
              --output "$tmp" --write-out '%{http_code}' "$base/$target")"
            echo "$target — HTTP $status ($(wc -c < "$tmp") bytes)"
            test "$status" = '200'
            test "$(wc -c < "$tmp")" -gt 200
            case "$target" in
              studio.html) grep -Fq 'id="mg-examiner-workspace"' "$tmp" ;;
              portal.html) grep -Fq 'id="mg-student-releases"' "$tmp" ;;
              examiner-workspace.js) grep -Fq 'buildExaminerRecords' "$tmp" ;;
              student-release-feed.js) grep -Fq 'buildStudentFeed' "$tmp" ;;
              examiner-workspace.css) grep -Fq '.mgex-student-card' "$tmp" ;;
              student-release-feed.css) grep -Fq '.mgsf-item' "$tmp" ;;
            esac
          done
          rm -f "$tmp"
          echo 'MathsGrove redesigned dashboards are published with their expected assets.'
