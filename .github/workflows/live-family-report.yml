name: MathsGrove live family and report delivery
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/live-family-report.yml'
  push:
    branches: [main]
    paths:
      - 'family.html'
      - 'family-timing.js'
      - 'family-timing.css'
      - 'report.html'
      - 'report-reader.js'
      - 'report-reader.css'
      - 'report-preview.css'
      - '.github/workflows/live-family-report.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify public report and family dashboard assets
        shell: bash
        run: |
          set -euo pipefail
          base="https://mathsgrove.github.io/Mathora"
          for target in index.html report.html report-reader.js report-reader.css report-preview.css family.html family-timing.js family-timing.css; do
            tmp="$(mktemp)"
            status="$(curl --silent --show-error --location --retry 2 --retry-delay 2 \
              --max-time 20 --output "$tmp" --write-out '%{http_code}' "$base/$target")"
            bytes="$(wc -c < "$tmp")"
            echo "$target status=$status bytes=$bytes"
            test "$status" = '200'
            test "$bytes" -gt 100
            case "$target" in
              index.html) grep -Fq 'href="./report.html"' "$tmp" ;;
              report.html) grep -Fq 'id="mgr-pages"' "$tmp" ;;
              report-reader.js) grep -Fq "source.length!==7" "$tmp" ;;
              report-reader.css) grep -Fq 'aspect-ratio:297/210' "$tmp" ;;
              report-preview.css) grep -Fq 'mg-report-compact' "$tmp" ;;
              family.html) grep -Fq 'id="fa-timing-dashboard"' "$tmp" ;;
              family-timing.js) grep -Fq 'renderFamilyTiming' "$tmp" ;;
              family-timing.css) grep -Fq '.fat-metrics' "$tmp" ;;
            esac
            rm -f "$tmp"
          done
          echo "Live MathsGrove family engagement and full-page report assets verified."
